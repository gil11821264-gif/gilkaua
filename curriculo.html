<head>

<meta charset="UTF-8">

<title>Currículo - Gil</title>

<style>

* { box-sizing: border-box; }

body { margin: 0; min-height: 100vh;

background: #050505;

color: white;

font-family: Arial, sans-serif;

display: flex; justify-content: center;

padding: 40px 20px; }

.container { width: 100%; max-width: 800px;

text-align: center; }

h1 { color: red;

text-shadow: 0 0 5px red, 0 0 15px red;

margin-bottom: 30px; }

/* FOTO COMPLETA DO CURRÍCULO */

.foto-curriculo { width: 100%; max-width: 700px;

height: auto;

display: block;

margin: 0 auto;

border: 2px solid red;

box-shadow: 0 0 10px red, 0 0 30px rgba(255, 0, 0, 0.5); }

/* BOTÃO */

.botao { display: inline-block;

margin-top: 30px;

padding: 15px 35px;

background: red;

color: white;

text-decoration: none;

font-size: 18px;

font-weight: bold;

border-radius: 5px;

transition: 0.3s; }

.botao:hover { background: #ff2222;

box-shadow: 0 0 10px red, 0 0 25px red;

transform: scale(1.05); }

/* VOLTAR */

.voltar { display: block;

margin-top: 20px;

color: #888;

text-decoration: none; }

.voltar:hover { color: red; }

</style>

</head>

<div class="container">
